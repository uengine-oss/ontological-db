[package]
name = "ext_a"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg16"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg_test = []
fixed-schema = ["og_shared/fixed-schema"]

[dependencies]
pgrx = { workspace = true }
og_shared = { path = "../og_shared" }
