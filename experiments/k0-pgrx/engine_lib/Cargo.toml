# The engine's own source tree (engine/src, unmodified) compiled as a plain library, to see that a
# real crate full of #[pg_extern] + extension_sql_file! ships through a thin extension crate.
# Dependencies copied from engine/Cargo.toml.
[package]
name = "og_engine_lib"
version = "0.1.0"
edition = "2021"

[lib]
path = "../../../engine/src/lib.rs"
crate-type = ["rlib"]

[features]
# engine/src/spiu.rs:70-72 and engine/src/fabric/query.rs:592,609 test these, so the library needs
# them itself; the extension crate forwards its pgXX feature here.
pg13 = ["pgrx/pg13"]
pg14 = ["pgrx/pg14"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]

[dependencies]
pgrx = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
