<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찾을 수 없는 페이지 — Ontological DB</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0e1319; color:#dbe3ea;
         font:17px/1.7 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; text-align:center; }
  a { color:#10b981; } h1 { font-size:26px; margin:0 0 8px; } p { margin:4px 0; color:#aab8c4; }
</style>
<div>
  <h1>이 주소에는 페이지가 없습니다</h1>
  <p>문서가 옮겨졌을 수 있습니다.</p>
  <p><a id="home" href="./">첫 화면</a> · <a id="docs" href="./docs/">문서</a></p>
</div>
<script>
  // A project site lives under /<repository>/; send the links there from any depth.
  const base = location.pathname.split('/').slice(0, 2).join('/') + '/';
  if (location.hostname.endsWith('github.io')) {
    document.getElementById('home').href = base;
    document.getElementById('docs').href = base + 'docs/';
  }
</script>
