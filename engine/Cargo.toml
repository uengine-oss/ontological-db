[package]
name = "ontological"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg16"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13" ]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
pgrx = "=0.19.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The extension's only outbound network, for `genai.vector.encode`. A blocking
# client with no runtime is the right shape here: a PostgreSQL backend is
# already the thread doing the waiting, so an async stack would buy nothing and
# cost a scheduler.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[dependencies.pgrx-bench]
version = "=0.19.2"
optional = true

[dev-dependencies]
[dev-dependencies.pgrx-tests]
version = "=0.19.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
